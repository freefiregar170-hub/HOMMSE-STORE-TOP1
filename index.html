<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HOMMSE STORE TOP1</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#090b10;color:#fff;font-family:Arial,Tahoma,sans-serif}
header{position:sticky;top:0;z-index:5;background:#121722;border-bottom:1px solid #293142;padding:16px}
.logo{text-align:center;font-size:24px;font-weight:800}.logo b{color:#ffb300}
.balance{max-width:600px;margin:10px auto 0;background:#1d2532;border-radius:14px;padding:10px;text-align:center}.balance strong{color:#ffd000;font-size:20px}
.container{max-width:650px;margin:auto;padding:16px}.card{background:#141a24;border:1px solid #293142;border-radius:18px;padding:18px;margin-bottom:16px}
input,select{width:100%;padding:14px;margin:6px 0;background:#0c1017;color:#fff;border:1px solid #354052;border-radius:11px}
button{width:100%;padding:13px;margin-top:8px;border:0;border-radius:11px;background:#ffb300;color:#111;font-weight:800;font-size:15px}
button.secondary{background:#252d3b;color:#fff}button:disabled{opacity:.45}
nav{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:15px}nav button{background:#1b2330;color:#fff;font-size:13px}nav button.active{background:#ffb300;color:#111}
.product{background:#1c2431;border:1px solid #303a4b;border-radius:13px;padding:14px;margin:9px 0}.product .name{font-weight:700}.price{color:#ffd000;font-size:18px;font-weight:800;margin-top:5px}
.hidden{display:none!important}.msg{margin-top:10px;padding:11px;border-radius:10px;background:#202936}.error{color:#ff7777}.ok{color:#68e39a}.muted{color:#9da8b8;font-size:13px}
.userbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}.logout{width:auto;background:#252d3b;color:#fff;padding:9px 13px}
h2,h3{margin-top:0}.admin-link{font-size:12px;color:#737e90;text-align:center;margin-top:18px}
</style>
</head>
<body>

<header id="header" class="hidden">
  <div class="logo"><b>HOMMSE</b> STORE TOP1</div>
  <div class="balance">الرصيد الحالي: <strong id="balance">0</strong></div>
</header>

<main class="container">

<section id="login" class="card">
<h2>🔐 تسجيل الدخول</h2>
<p class="muted">يجب تسجيل الدخول للوصول إلى المتجر.</p>
<input id="loginEmail" type="email" placeholder="Gmail / البريد الإلكتروني">
<input id="loginPassword" type="password" placeholder="كلمة السر">
<button onclick="login()">تسجيل الدخول</button>
<button class="secondary" onclick="show('register')">إنشاء حساب</button>
<button class="secondary" onclick="show('agent')">الدخول بواسطة كود وكيل</button>
<div id="loginMsg"></div>
</section>

<section id="register" class="card hidden">
<h2>📝 إنشاء حساب</h2>
<input id="regName" placeholder="الاسم">
<input id="regEmail" type="email" placeholder="Gmail / البريد الإلكتروني">
<input id="regPhone" placeholder="رقم الهاتف">
<input id="regPassword" type="password" placeholder="كلمة السر (6 أحرف/أرقام على الأقل)">
<input id="regAgent" placeholder="كود الوكيل (اختياري)">
<button onclick="registerUser()">إنشاء الحساب</button>
<button class="secondary" onclick="show('login')">العودة لتسجيل الدخول</button>
<div id="registerMsg"></div>
</section>

<section id="agent" class="card hidden">
<h2>👤 دخول بواسطة كود وكيل</h2>
<p class="muted">هذه الواجهة جاهزة، وسيتم ربط أكواد الوكلاء بالتحقق من قاعدة البيانات.</p>
<input id="agentCode" placeholder="كود الوكيل">
<button onclick="agentLogin()">دخول</button>
<button class="secondary" onclick="show('login')">العودة</button>
<div id="agentMsg"></div>
</section>

<section id="store" class="hidden">
<div class="userbar"><span>مرحباً، <b id="userName"></b></span><button class="logout" onclick="logout()">خروج</button></div>
<nav>
<button class="active" onclick="section('freefire',this)">🎮 فري فاير</button>
<button onclick="section('balances',this)">💰 الأرصدة</button>
<button onclick="section('gift',this)">🎁 كود هدية</button>
</nav>

<div id="freefire">
<div class="card">
<h3>👑 العضويات</h3>
<input id="membershipId" placeholder="معرف اللاعب ID">
<select id="membershipServer"><option value="">اختر السيرفر</option><option>شرق أوسط</option><option>أوروبا</option></select>
<div id="memberships"></div>
</div>
<div class="card">
<h3>💎 الجواهر</h3>
<input id="diamondId" placeholder="معرف اللاعب ID">
<select id="diamondServer"><option value="">اختر السيرفر</option><option>شرق أوسط</option><option>أوروبا</option><option>تركي</option></select>
<div id="diamonds"></div>
</div>
</div>

<div id="balances" class="hidden">
<div class="card">
<h3>📱 رصيد MTN</h3>
<input id="mtnPhone" placeholder="رقم الهاتف">
<input id="mtnConfirm" placeholder="تأكيد رقم الهاتف">
<input id="mtnAmount" type="number" min="10" step="10" placeholder="الكمية">
<p>السعر: <b id="mtnPrice">0</b></p>
<button onclick="buyBalance('MTN')">شراء رصيد MTN</button>
</div>
<div class="card">
<h3>📱 رصيد Syriatel</h3>
<input id="syPhone" placeholder="رقم الهاتف">
<input id="syConfirm" placeholder="تأكيد رقم الهاتف">
<input id="syAmount" type="number" min="10" step="10" placeholder="الكمية">
<p>السعر: <b id="syPrice">0</b></p>
<button onclick="buyBalance('Syriatel')">شراء رصيد Syriatel</button>
</div>
</div>

<div id="gift" class="hidden">
<div class="card">
<h3>🎁 استبدال كود هدايا</h3>
<input id="giftCode" placeholder="اكتب كود الهدية">
<button onclick="redeemGift()">استبدال</button>
<div id="giftMsg"></div>
</div>
</div>
</section>
</main>

<script>
const SUPABASE_URL="https://rndscbzzujbmaprofuhy.supabase.co";
const SUPABASE_KEY="sb_publishable_SBaw1KlxqwGE4_QGzm1jXA_wkWUuMdK";
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

const memberships=[
["عضوية شهرية",1600],["عضوية أسبوعية",350],["عضوية أسبوعية دبل",650],
["حزمة مستوى 6",100],["حزمة مستوى 10",140],["حزمة مستوى 15",140],
["حزمة مستوى 20",140],["حزمة مستوى 25",140],["حزمة مستوى 30",160]];
const diamonds=[["100 جوهرة",140],["200 جواهر",280],["500 جوهرة",700],["1060 جوهرة",1400],["2180 جوهرة",2700]];

let profile=null;

function show(id){["login","register","agent"].forEach(x=>document.getElementById(x).classList.add("hidden"));document.getElementById(id).classList.remove("hidden")}
function msg(id,text,type="error"){document.getElementById(id).innerHTML=`<div class="msg ${type}">${text}</div>`}

async function loadProfile(user){
  const {data,error}=await db.from("profiles").select("*").eq("id",user.id).maybeSingle();
  if(error){console.error(error);profile={id:user.id,name:user.email?.split("@")[0]||"مستخدم",balance:0};}
  else profile=data||{id:user.id,name:user.email?.split("@")[0]||"مستخدم",balance:0};
  document.getElementById("userName").textContent=profile.name||user.email;
  document.getElementById("balance").textContent=Number(profile.balance||0);
}

async function enterStore(user){
  await loadProfile(user);
  ["login","register","agent"].forEach(x=>document.getElementById(x).classList.add("hidden"));
  document.getElementById("store").classList.remove("hidden");
  document.getElementById("header").classList.remove("hidden");
  renderProducts();
}

async function login(){
  const email=document.getElementById("loginEmail").value.trim();
  const password=document.getElementById("loginPassword").value;
  if(!email||!password)return msg("loginMsg","يرجى إدخال البريد الإلكتروني وكلمة السر");
  const {data,error}=await db.auth.signInWithPassword({email,password});
  if(error)return msg("loginMsg",error.message);
  await enterStore(data.user);
}

async function registerUser(){
  const name=document.getElementById("regName").value.trim();
  const email=document.getElementById("regEmail").value.trim();
  const phone=document.getElementById("regPhone").value.trim();
  const password=document.getElementById("regPassword").value;
  if(!name||!email||!phone||!password)return msg("registerMsg","يرجى تعبئة جميع الحقول");
  if(password.length<6||!/[A-Za-z]/.test(password)||!/\d/.test(password))
    return msg("registerMsg","كلمة السر يجب أن تحتوي على 6 أحرف/أرقام على الأقل مع حرف ورقم");
  const {data,error}=await db.auth.signUp({email,password});
  if(error)return msg("registerMsg",error.message);
  if(data.user){
    const {error:e}=await db.from("profiles").insert({id:data.user.id,name,phone,balance:0});
    if(e) console.error(e);
  }
  if(!data.session){
    return msg("registerMsg","تم إنشاء الحساب. افتح بريدك الإلكتروني لتأكيد الحساب ثم سجّل الدخول.","ok");
  }
  await enterStore(data.user);
}

async function logout(){await db.auth.signOut();location.reload()}

async function agentLogin(){
  const code=document.getElementById("agentCode").value.trim();
  if(!code)return msg("agentMsg","يرجى إدخال كود الوكيل");
  msg("agentMsg","سيتم ربط تسجيل دخول الوكيل بجدول agent_codes في الخطوة التالية.","ok");
}

function renderProducts(){
  document.getElementById("memberships").innerHTML=memberships.map(x=>`
  <div class="product"><div class="name">${x[0]}</div><div class="price">${x[1]}</div>
  <button onclick="buyProduct('${x[0]}',${x[1]},'membership')">شراء</button></div>`).join("");
  document.getElementById("diamonds").innerHTML=diamonds.map(x=>`
  <div class="product"><div class="name">${x[0]}</div><div class="price">${x[1]}</div>
  <button onclick="buyProduct('${x[0]}',${x[1]},'diamonds')">شراء</button></div>`).join("");
}

async function buyProduct(name,price,type){
  if(!profile)return;
  if(Number(profile.balance)<price)return alert("رصيدك غير كافي لإتمام عملية الشراء");
  const player=document.getElementById(type==="membership"?"membershipId":"diamondId").value.trim();
  const server=document.getElementById(type==="membership"?"membershipServer":"diamondServer").value;
  if(!player)return alert("يرجى كتابة معرف اللاعب أولاً");
  if(!server)return alert("يرجى اختيار السيرفر");
  alert("الواجهة جاهزة. سيتم تنفيذ الخصم وإنشاء الطلب بشكل آمن على الخادم في الخطوة التالية.");
}

function buyBalance(type){
  let phone,confirm,amount,price;
  if(type==="MTN"){phone=mtnPhone.value.trim();confirm=mtnConfirm.value.trim();amount=Number(mtnAmount.value);price=(amount/10)*12}
  else{phone=syPhone.value.trim();confirm=syConfirm.value.trim();amount=Number(syAmount.value);price=(amount/10)*11}
  if(!phone||!confirm||!amount)return alert("يرجى تعبئة جميع الحقول");
  if(phone!==confirm)return alert("رقم الهاتف وتأكيد الرقم غير متطابقين");
  alert("الواجهة جاهزة. سيتم إنشاء الطلب والخصم بشكل آمن في الخطوة التالية.");
}

async function redeemGift(){
  const code=document.getElementById("giftCode").value.trim();
  if(!code)return msg("giftMsg","يرجى كتابة الكود");
  msg("giftMsg","سيتم ربط استبدال الأكواد بالمعاملة الآمنة في قاعدة البيانات في الخطوة التالية.","ok");
}

function section(id,btn){
  ["freefire","balances","gift"].forEach(x=>document.getElementById(x).classList.add("hidden"));
  document.getElementById(id).classList.remove("hidden");
  document.querySelectorAll("nav button").forEach(x=>x.classList.remove("active"));
  btn.classList.add("active");
}
mtnAmount.addEventListener("input",()=>mtnPrice.textContent=(Number(mtnAmount.value||0)/10)*12);
syAmount.addEventListener("input",()=>syPrice.textContent=(Number(syAmount.value||0)/10)*11);

db.auth.onAuthStateChange(async(event,session)=>{
  if(session) await enterStore(session.user);
  else show("login");
});
</script>
</body>
  </html>
